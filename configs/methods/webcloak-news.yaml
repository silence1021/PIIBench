      api_key_env: OPENAI_API_KEY
      request_timeout_seconds: 600
      request_parameters: {}
      omit_parameters: []
      request_headers: {}
    max_retries: 3
    retry_backoff_seconds: 1.0
search:
  channel: raw
  depth: 5
  branch: 2
  initial_word_count: 200
  increase: 75
  batch_size: 2
  concurrency: 10
  rng_seed: 42
evaluation:
  channels:
  - raw
  - canonical
  attacker_conditions:
