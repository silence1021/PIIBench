      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      request_timeout_seconds: 600
      request_parameters:
        reasoning:
          exclude: false
      omit_parameters: []
      request_headers:
        X-OpenRouter-Metadata: enabled
    max_retries: 3
    retry_backoff_seconds: 1.0
  filter:
    backend: openai
    model: gpt-6-luna
    effort: medium
    temperature: null
    max_tokens: null
    client_settings:
